# Copy to .agents/aish.yaml, read by default, or run ./aish -config <path>.
#
# A top-level block per module, keyed by its name in module.Register. A block for a module that is not
# built into the binary is an error, so uncomment only what you built with -with.
#
# LLM providers are opt-in: one runs only when its block is here, `anthropic: {}` is enough.
# Build both and keep one block, or both answer every message.

anthropic:
  model: claude-opus-5-5
  max_tokens: 64000
  # token: sk-ant-...                    # else ANTHROPIC_API_KEY or the `ant auth login` profile
  # base_url: https://api.anthropic.com  # else ANTHROPIC_BASE_URL; without /v1, unlike openai

# openai:
#   model: gpt-5.5
#   token: sk-...                        # else OPENAI_API_KEY
#   base_url: https://api.openai.com/v1  # else OPENAI_BASE_URL; with /v1, unlike anthropic

# context.system_prompt:                 # without a block: the built-in prompt
#   text: |
#     You are ...
#   # file: prompts/aish.md              # or this, relative to the working directory; not both

# log:                                   # without a block: info, jsonl, $XDG_STATE_HOME/.aish/logs/%D_%T_%S.log
#   level: debug                         # warn | info | debug; debug holds the prompts
#   format: text                         # jsonl | text
#   file: aish-%D.log                    # %D date, %T time, %S session UUID, %% a "%"
